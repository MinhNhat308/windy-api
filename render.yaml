services:
  - type: web
    name: windy-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: windy
      - key: ALLOWED_ORIGINS
        value: http://tauri.localhost,https://tauri.localhost,tauri://localhost,http://127.0.0.1:1420
